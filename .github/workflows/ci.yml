name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (tests + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Placeholders only: Prisma's config needs them to generate the client.
      # Tests use an in-memory fake Prisma and never open a database connection.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/never_used
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/never_used
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  client:
    name: Client (typecheck + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  admin:
    name: Admin dashboard (typecheck + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminDashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adminDashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
