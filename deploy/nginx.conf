# Uses the free sslip.io name for 157.10.73.38. With a real domain, replace it, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/passkru
#   sudo ln -s /etc/nginx/sites-available/passkru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.157-10-73-38.sslip.io -d admin.157-10-73-38.sslip.io -d api.157-10-73-38.sslip.io

server {
  server_name app.157-10-73-38.sslip.io;
  root /var/www/passkru/client;
  index index.html;
  location / { try_files $uri /index.html; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}

server {
  server_name admin.157-10-73-38.sslip.io;
  root /var/www/passkru/admin;
  index index.html;
  location / { try_files $uri /index.html; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}

server {
  server_name api.157-10-73-38.sslip.io;
  client_max_body_size 20m;
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
